name: Build APK

# Fork build: Mika without the phone_system_command tool, signed with the fork's own key.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # The key only ever exists on the runner; secrets are masked in the public log.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_B64 and KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/mika.p12

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # Refuse to publish anything not signed with the fork's key (certificate fingerprint is public).
      - name: Check signature
        run: |
          expected="dff6719fbad32b95450618f250f82ba042e852347dace02eca58f81fd049c1ef"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "$apk: $got"
            [ "$got" = "$expected" ] || { echo "::error::$apk is not signed with the fork key"; exit 1; }
          done

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk mika-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-universal-release.apk mika-universal.apk
          rm -rf keystore

      - uses: actions/upload-artifact@v5
        with:
          name: mika-apk
          path: mika-*.apk

      # A fixed "latest" release, so the phone can always download from the same page
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mika-arm64-v8a.apk mika-universal.apk \
            --title "Mika fork build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Mika without the phone_system_command tool. Most phones want mika-arm64-v8a.apk."
